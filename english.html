<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f7f4;--card:#fff;--primary:#7ecba1;--primary-dark:#5db88b;--text:#4a6b5d;--text-light:#7a9a8b;--border:#e0ede5;--warn:#ffa07a;--radius:16px;--shadow:0 2px 12px rgba(126,203,161,0.15)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;background-image:radial-gradient(ellipse at top,#e8f5ee 0%,#f0f7f4 60%)}
.container{max-width:520px;width:100%}
.header{text-align:center;padding:20px 0 12px}
.header h1{font-size:1.6rem;color:#3d7a5c;font-weight:700;letter-spacing:1px}
.header .sub{font-size:0.85rem;color:var(--text-light);margin-top:4px}

/* Timer */
.timer-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:center;margin-bottom:14px;border:1px solid var(--border)}
.timer-ring{position:relative;width:90px;height:90px;margin:0 auto 8px}
.timer-ring svg{transform:rotate(-90deg);width:90px;height:90px}
.timer-bg{fill:none;stroke:#e8f0eb;stroke-width:6}
.timer-progress{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#3d7a5c}
.timer-label{font-size:0.82rem;color:var(--text-light)}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:8px}
.btn{padding:9px 22px;border:none;border-radius:24px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-start{background:var(--primary);color:#fff}
.btn-start:hover{background:var(--primary-dark)}
.btn-pause{background:#fff3e0;color:#e08b5a}
.btn-pause:hover{background:#ffe0cc}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* Content */
.content-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.level-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.level-tab{padding:8px 16px;border:2px solid var(--border);border-radius:20px;background:#fff;font-size:0.82rem;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;transition:all 0.2s}
.level-tab:hover{border-color:var(--primary)}
.level-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.topic-card{background:#f9fdfb;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.topic-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topic-title{font-weight:700;font-size:0.95rem;color:#3d7a5c}
.topic-badge{font-size:0.68rem;padding:3px 10px;border-radius:12px;background:#e8f5ee;color:var(--primary-dark);font-weight:600}

.listen-section{margin-bottom:10px}
.listen-btn{padding:7px 16px;border:none;border-radius:20px;background:var(--primary);color:#fff;font-size:0.82rem;cursor:pointer;font-weight:600;transition:all 0.2s;display:inline-flex;align-items:center;gap:4px}
.listen-btn:hover{background:var(--primary-dark)}
.listen-btn.slow{background:#a0d2b8;font-size:0.75rem}
.listen-btn.slow:hover{background:var(--primary)}

.passage-text{font-size:0.88rem;line-height:1.8;color:var(--text);margin:10px 0;padding:10px 14px;background:#f5faf7;border-radius:10px;min-height:40px}
.passage-text .line{cursor:pointer;padding:3px 6px;border-radius:6px;transition:background 0.2s;display:inline}
.passage-text .line:hover{background:#e8f5ee}

.questions{margin-top:10px}
.q-item{padding:8px 12px;margin-bottom:6px;border-radius:10px;background:#fff;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
.q-item:hover{border-color:var(--primary);background:#f5faf7}
.q-item .q{font-size:0.85rem;font-weight:600;color:#3d7a5c}
.q-item .a{font-size:0.82rem;color:var(--text);margin-top:4px;display:none}
.q-item.show .a{display:block}
.q-item.show{border-color:var(--primary);background:#f0faf5}

.vocab-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vocab-tag{padding:4px 10px;background:#f5faf7;border-radius:16px;font-size:0.78rem;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
.vocab-tag:hover{background:#e8f5ee}
.vocab-tag .en{font-weight:700;color:#3d7a5c}
.vocab-tag .zh{color:var(--text-light);font-size:0.7rem}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#3d7a5c;color:#fff;padding:10px 24px;border-radius:24px;font-size:0.9rem;font-weight:600;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

/* Complete */
.complete-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center}
.complete-overlay.show{display:flex}
.complete-box{background:#fff;border-radius:20px;padding:32px;text-align:center;max-width:320px;width:90%}
.complete-box .emoji{font-size:3rem;margin-bottom:12px}
.complete-box h2{font-size:1.3rem;color:#3d7a5c;margin-bottom:6px}
.complete-box p{font-size:0.9rem;color:var(--text-light);margin-bottom:16px}
.complete-box button{padding:10px 28px;border:none;border-radius:24px;background:var(--primary);color:#fff;font-size:0.9rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎧 高兴的英语磨耳朵</h1>
<div class="sub">三升四听力训练 · 每天15分钟</div>
</div>

<div class="timer-card">
<div class="timer-ring">
<svg viewBox="0 0 90 90"><circle class="timer-bg" cx="45" cy="45" r="39"/><circle class="timer-progress" id="timer-circle" cx="45" cy="45" r="39" stroke-dasharray="245.04" stroke-dashoffset="0"/></svg>
<div class="timer-text" id="timer-display">15:00</div>
</div>
<div class="timer-label" id="timer-status">准备开始</div>
<div class="btn-row">
<button class="btn btn-start" id="btn-start" onclick="startTimer()">▶ 开始磨耳朵</button>
<button class="btn btn-pause" id="btn-pause" onclick="pauseTimer()" disabled>⏸ 暂停</button>
</div>
</div>

<div class="content-card">
<div class="level-tabs" id="level-tabs"></div>
<div id="topic-content"></div>
</div>
</div>

<div class="toast" id="toast"></div>
<div class="complete-overlay" id="complete-overlay">
<div class="complete-box">
<div class="emoji">🎉</div>
<h2>今天磨耳朵完成！</h2>
<p>15分钟到啦，你真棒！<br>明天继续加油哦~</p>
<button onclick="closeComplete()">👍 知道啦</button>
</div>
</div>

// ==================== Timer ====================
const TOTAL_SECONDS = 15 * 60;
const CIRCUMFERENCE = 2 * Math.PI * 39;
let timerRunning = false, timerPaused = false, remainingSeconds = TOTAL_SECONDS, timerInterval = null;
let currentLevel = 1;
const synth = window.speechSynthesis;

function updateTimerDisplay() {
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  document.getElementById('timer-display').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const progress = remainingSeconds / TOTAL_SECONDS;
  document.getElementById('timer-circle').style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
  document.getElementById('timer-circle').style.stroke = progress < 0.2 ? '#ffa07a' : 'var(--primary)';
}

function startTimer() {
  if (timerRunning && !timerPaused) return;
  if (!timerPaused) remainingSeconds = TOTAL_SECONDS;
  timerRunning = true; timerPaused = false;
  document.getElementById('btn-start').textContent = '▶ 进行中...';
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('timer-status').textContent = '正在磨耳朵...';
  updateTimerDisplay();
  timerInterval = setInterval(() => { remainingSeconds--; updateTimerDisplay(); if (remainingSeconds <= 0) completeTimer(); }, 1000);
}

function pauseTimer() {
  if (!timerRunning || timerPaused) return;
  timerPaused = true; clearInterval(timerInterval);
  document.getElementById('btn-start').textContent = '▶ 继续';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('timer-status').textContent = '已暂停';
}

function completeTimer() {
  clearInterval(timerInterval); timerRunning = false; timerPaused = false;
  remainingSeconds = TOTAL_SECONDS; updateTimerDisplay();
  document.getElementById('btn-start').textContent = '▶ 重新开始';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('timer-status').textContent = '完成！';
  document.getElementById('complete-overlay').classList.add('show');
  synth.cancel();
  const today = new Date().toISOString().slice(0,10);
  const done = JSON.parse(localStorage.getItem('english_done') || '[]');
  if (!done.includes(today)) { done.push(today); localStorage.setItem('english_done', JSON.stringify(done)); }
}

function closeComplete() { document.getElementById('complete-overlay').classList.remove('show'); }

// ==================== TTS ====================
function speak(text, rate) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate || 0.82; u.pitch = 1;
  synth.speak(u);
}

// ==================== Render ====================
function renderLevelTabs() {
  const levels = [...new Set(TOPICS.map(t => t.level))];
  let html = '';
  for (const l of levels) {
    const sample = TOPICS.find(t => t.level === l);
    html += `<button class="level-tab ${l === currentLevel ? 'active' : ''}" onclick="selectLevel(${l})">${sample.label}</button>`;
  }
  document.getElementById('level-tabs').innerHTML = html;
}

function selectLevel(l) { currentLevel = l; renderLevelTabs(); renderTopics(); }

function renderTopics() {
  const filtered = TOPICS.filter(t => t.level === currentLevel);
  let html = '';
  for (let i = 0; i < filtered.length; i++) {
    const t = filtered[i];
    html += `<div class="topic-card">
      <div class="topic-header">
        <span class="topic-title">${t.title}</span>
        <span class="topic-badge">${t.theme}</span>
      </div>
      <div class="listen-section">
        <button class="listen-btn" onclick="speakPassage(${TOPICS.indexOf(t)})">🔊 听全文</button>
        <button class="listen-btn slow" onclick="speakPassage(${TOPICS.indexOf(t)}, true)">🐢 慢速</button>
      </div>
      <div class="passage-text" id="passage-${i}">
        ${t.passage.map((line, li) => `<span class="line" onclick="speak('${line.replace(/'/g,"\\'")}',0.82)">${line}</span>`).join('<br>')}
      </div>
      <div style="font-size:0.75rem;color:var(--text-light);margin-bottom:8px;">💡 点任意一句可以单独听哦</div>
      <div class="vocab-row">
        ${t.vocab.map(v => `<span class="vocab-tag" onclick="speak('${v.en.replace(/'/g,"\\'")}',0.75)"><span class="en">${v.en}</span> <span class="zh">${v.zh}</span></span>`).join('')}
      </div>
      <div class="questions" style="margin-top:10px;">
        <div style="font-weight:700;font-size:0.82rem;color:var(--primary-dark);margin-bottom:6px;">❓ 听力理解（点击看答案）</div>
        ${t.questions.map((q, qi) => `
          <div class="q-item" onclick="this.classList.toggle('show')">
            <div class="q">${q.q}</div>
            <div class="a">💬 ${q.a}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }
  document.getElementById('topic-content').innerHTML = html;
}

function speakPassage(idx, slow) {
  const t = TOPICS[idx];
  const text = t.passage.join('. ');
  speak(text, slow ? 0.65 : 0.82);
  showToast(slow ? '🐢 慢速朗读中...' : '🔊 全文朗读中...');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ==================== Init ====================
function init() {
  renderLevelTabs(); renderTopics(); updateTimerDisplay();
  const today = new Date().toISOString().slice(0,10);
  const done = JSON.parse(localStorage.getItem('english_done') || '[]');
  if (done.includes(today)) document.getElementById('timer-status').textContent = '✅ 今天已完成磨耳朵';
}
document.addEventListener('DOMContentLoaded', init);
</script>
