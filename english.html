<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f7f4;--card:#fff;--primary:#7ecba1;--primary-dark:#5db88b;--text:#4a6b5d;--text-light:#7a9a8b;--border:#e0ede5;--warn:#ffa07a;--radius:16px;--shadow:0 2px 12px rgba(126,203,161,0.15)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;background-image:radial-gradient(ellipse at top,#e8f5ee 0%,#f0f7f4 60%)}
.container{max-width:500px;width:100%}
.header{text-align:center;padding:20px 0 12px}
.header h1{font-size:1.6rem;color:#3d7a5c;font-weight:700;letter-spacing:1px}
.header .sub{font-size:0.85rem;color:var(--text-light);margin-top:4px}

/* Timer */
.timer-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:center;margin-bottom:16px;border:1px solid var(--border)}
.timer-ring{position:relative;width:100px;height:100px;margin:0 auto 10px}
.timer-ring svg{transform:rotate(-90deg);width:100px;height:100px}
.timer-bg{fill:none;stroke:#e8f0eb;stroke-width:6}
.timer-progress{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#3d7a5c}
.timer-label{font-size:0.85rem;color:var(--text-light)}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.btn{padding:10px 24px;border:none;border-radius:24px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-start{background:var(--primary);color:#fff}
.btn-start:hover{background:var(--primary-dark)}
.btn-pause{background:#fff3e0;color:#e08b5a}
.btn-pause:hover{background:#ffe0cc}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* Content */
.content-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--border);min-height:200px}
.unit-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.unit-btn{padding:6px 14px;border:2px solid var(--border);border-radius:20px;background:#fff;font-size:0.82rem;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.2s}
.unit-btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.unit-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.section-label{font-size:0.8rem;font-weight:700;color:var(--primary-dark);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.vocab-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.vocab-chip{padding:5px 12px;background:#f5faf7;border-radius:20px;font-size:0.8rem;color:var(--text);border:1px solid var(--border)}
.vocab-chip .en{font-weight:700;color:#3d7a5c}
.vocab-chip .zh{color:var(--text-light);font-size:0.72rem}

.sentence-item{padding:8px 12px;background:#fcfefd;border-radius:10px;margin-bottom:6px;font-size:0.85rem;line-height:1.6;border-left:3px solid var(--primary)}
.sentence-item .en{font-weight:600;color:#3d7a5c}
.sentence-item .zh{color:var(--text-light);font-size:0.78rem;margin-top:2px}

.passage-box{background:#f9fdfb;border-radius:12px;padding:14px;line-height:1.8;font-size:0.88rem}
.passage-box p{margin-bottom:8px}
.passage-box .en-text{font-weight:600;color:#3d7a5c}
.passage-box .zh-text{color:var(--text-light);font-size:0.8rem}

/* TTS highlight */
.tts-highlight{background:#ffe082;padding:1px 2px;border-radius:3px;transition:all 0.3s}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#3d7a5c;color:#fff;padding:10px 24px;border-radius:24px;font-size:0.9rem;font-weight:600;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

/* Complete overlay */
.complete-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center}
.complete-overlay.show{display:flex}
.complete-box{background:#fff;border-radius:20px;padding:32px;text-align:center;max-width:320px;width:90%}
.complete-box .emoji{font-size:3rem;margin-bottom:12px}
.complete-box h2{font-size:1.3rem;color:#3d7a5c;margin-bottom:6px}
.complete-box p{font-size:0.9rem;color:var(--text-light);margin-bottom:16px}
.complete-box button{padding:10px 28px;border:none;border-radius:24px;background:var(--primary);color:#fff;font-size:0.9rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎧 高兴的英语磨耳朵</h1>
    <div class="sub">沪教版 · 三升四衔接 · 每天15分钟</div>
  </div>

  <!-- Timer -->
  <div class="timer-card">
    <div class="timer-ring">
      <svg viewBox="0 0 100 100">
        <circle class="timer-bg" cx="50" cy="50" r="44"/>
        <circle class="timer-progress" id="timer-circle" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text" id="timer-display">15:00</div>
    </div>
    <div class="timer-label" id="timer-status">准备开始</div>
    <div class="btn-row">
      <button class="btn btn-start" id="btn-start" onclick="startTimer()">▶ 开始磨耳朵</button>
      <button class="btn btn-pause" id="btn-pause" onclick="pauseTimer()" disabled>⏸ 暂停</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content-card" id="content-area">
    <div class="unit-selector" id="unit-buttons"></div>
    <div id="unit-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="complete-overlay" id="complete-overlay">
  <div class="complete-box">
    <div class="emoji">🎉</div>
    <h2>今天磨耳朵完成！</h2>
    <p>15分钟到啦，你真棒！<br>明天继续加油哦~</p>
    <button onclick="closeComplete()">👍 知道啦</button>
  </div>
</div>

// ==================== Timer ====================
const TOTAL_SECONDS = 15 * 60;
const CIRCUMFERENCE = 2 * Math.PI * 44; // ~276.46

let timerRunning = false;
let timerPaused = false;
let remainingSeconds = TOTAL_SECONDS;
let timerInterval = null;
let speechSynth = window.speechSynthesis;
let currentUnitIdx = 0;

function updateTimerDisplay() {
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  document.getElementById('timer-display').textContent = `${m}:${String(s).padStart(2,'0')}`;
  
  const progress = remainingSeconds / TOTAL_SECONDS;
  const offset = CIRCUMFERENCE * (1 - progress);
  document.getElementById('timer-circle').style.strokeDashoffset = offset;
  
  if (progress < 0.2) {
    document.getElementById('timer-circle').style.stroke = '#ffa07a';
  } else {
    document.getElementById('timer-circle').style.stroke = 'var(--primary)';
  }
}

function startTimer() {
  if (timerRunning && !timerPaused) return;
  
  if (!timerPaused) {
    remainingSeconds = TOTAL_SECONDS;
  }
  
  timerRunning = true;
  timerPaused = false;
  document.getElementById('btn-start').textContent = '▶ 进行中...';
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('timer-status').textContent = '正在磨耳朵...';
  
  updateTimerDisplay();
  
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimerDisplay();
    
    if (remainingSeconds <= 0) {
      completeTimer();
    }
  }, 1000);
}

function pauseTimer() {
  if (!timerRunning || timerPaused) return;
  timerPaused = true;
  clearInterval(timerInterval);
  document.getElementById('btn-start').textContent = '▶ 继续';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('timer-status').textContent = '已暂停';
}

function completeTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerPaused = false;
  remainingSeconds = TOTAL_SECONDS;
  updateTimerDisplay();
  document.getElementById('btn-start').textContent = '▶ 重新开始';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('timer-status').textContent = '完成！';
  document.getElementById('complete-overlay').classList.add('show');
  
  // 停止朗读
  speechSynth.cancel();
  
  // 记录完成日期
  const today = new Date().toISOString().slice(0,10);
  const done = JSON.parse(localStorage.getItem('english_done') || '[]');
  if (!done.includes(today)) {
    done.push(today);
    localStorage.setItem('english_done', JSON.stringify(done));
  }
}

function closeComplete() {
  document.getElementById('complete-overlay').classList.remove('show');
}

// ==================== TTS ====================
function speak(text, lang) {
  speechSynth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.85;
  u.pitch = 1;
  speechSynth.speak(u);
}

// ==================== Content Render ====================
function renderUnitButtons() {
  const container = document.getElementById('unit-buttons');
  let html = '';
  let lastGrade = '';
  for (let i = 0; i < UNITS.length; i++) {
    if (UNITS[i].grade !== lastGrade) {
      lastGrade = UNITS[i].grade;
      html += `<span style="font-size:0.7rem;color:var(--text-light);margin:0 4px;align-self:center;">|</span>`;
    }
    html += `<button class="unit-btn ${i === currentUnitIdx ? 'active' : ''}" onclick="selectUnit(${i})">${UNITS[i].unit}</button>`;
  }
  container.innerHTML = html;
}

function selectUnit(idx) {
  currentUnitIdx = idx;
  renderUnitButtons();
  renderUnitContent();
}

function renderUnitContent() {
  const u = UNITS[currentUnitIdx];
  const container = document.getElementById('unit-content');
  
  let html = '';
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <div><strong style="font-size:1rem;color:#3d7a5c;">${u.grade} ${u.unit}</strong>
    <span style="font-size:0.8rem;color:var(--text-light);margin-left:8px;">${u.title}</span></div>
    <span style="font-size:0.7rem;background:#e8f5ee;padding:3px 10px;border-radius:12px;color:var(--primary-dark);">${u.theme}</span>
  </div>`;
  
  // 词汇
  html += '<div class="section-label">📖 核心词汇 <span style="font-weight:400;font-size:0.7rem;cursor:pointer;color:var(--primary);" onclick="speakVocab()">🔊 跟读</span></div>';
  html += '<div class="vocab-list">';
  for (const v of u.vocab) {
    html += `<div class="vocab-chip" onclick="speak('${v.en.replace(/'/g,"\\'")}', 'en-US')"><span class="en">${v.en}</span> <span class="zh">${v.zh}</span></div>`;
  }
  html += '</div>';
  
  // 句型
  html += '<div class="section-label">💬 重点句型 <span style="font-weight:400;font-size:0.7rem;cursor:pointer;color:var(--primary);" onclick="speakSentences()">🔊 播放全部</span></div>';
  for (const s of u.sentences) {
    html += `<div class="sentence-item" onclick="speak('${s.en.replace(/'/g,"\\'")}', 'en-US')">
      <div class="en">${s.en}</div>
      <div class="zh">${s.zh}</div>
    </div>`;
  }
  
  container.innerHTML = html;
}

function speakVocab() {
  const u = UNITS[currentUnitIdx];
  const words = u.vocab.map(v => v.en).join('. ');
  speak(words, 'en-US');
  showToast('🔊 朗读核心词汇中...');
}

function speakSentences() {
  const u = UNITS[currentUnitIdx];
  const text = u.sentences.map(s => s.en).join('. ');
  speak(text, 'en-US');
  showToast('🔊 朗读重点句型中...');
}

// ==================== Toast ====================
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ==================== Init ====================
function init() {
  renderUnitButtons();
  renderUnitContent();
  updateTimerDisplay();
  
  // 检查今天是否已完成
  const today = new Date().toISOString().slice(0,10);
  const done = JSON.parse(localStorage.getItem('english_done') || '[]');
  if (done.includes(today)) {
    document.getElementById('timer-status').textContent = '✅ 今天已完成磨耳朵';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
